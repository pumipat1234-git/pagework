<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scopus Data Visualization (Auto Load)</title>
    <!-- โหลดไลบรารี Chart.js สำหรับวาดกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .file-container {
            background: #fff;
            margin-bottom: 40px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .file-title {
            color: #2980b9;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 1.2em;
        }
        .charts-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .chart-box {
            flex: 1 1 400px;
            max-width: 500px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }
    </style>
</head>
<body>

    <h1>รายงานข้อมูล Scopus (แสดงผลอัตโนมัติ)</h1>
    
    <!-- พื้นที่แสดงข้อมูลไฟล์ที่ 1 -->
    <div class="file-container">
        <h2 class="file-title">ไฟล์: scopus_export_Aug 12-2026_563f02c4-9409-4e98-9a57-285d8c40cad2.csv</h2>
        <div class="charts-wrapper">
            <div class="chart-box">
                <canvas id="chart-doc-type-1"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="chart-source-1"></canvas>
            </div>
        </div>
    </div>

    <!-- พื้นที่แสดงข้อมูลไฟล์ที่ 2 -->
    <div class="file-container">
        <h2 class="file-title">ไฟล์: scopus_export_Aug 12-2026_ab8f190a-cf23-4c15-b130-93b44386908f.csv</h2>
        <div class="charts-wrapper">
            <div class="chart-box">
                <canvas id="chart-doc-type-2"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="chart-source-2"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลที่ถูกดึงและสรุปผลมาจากไฟล์ CSV ทั้ง 2 ไฟล์
        const scopusData = {
            file1: {
                docTypes: { "Article": 206, "Conference paper": 80, "Review": 11, "Conference review": 2, "Erratum": 1 },
                topSources: { 
                    "Leibniz Int. Proc. in Informatics": 17, 
                    "Nonlinear Dynamics": 9, 
                    "Mathematics": 5, 
                    "Electronics (Switzerland)": 4, 
                    "Chaos, Solitons and Fractals": 4 
                }
            },
            file2: {
                docTypes: { "Article": 261, "Conference paper": 39 },
                topSources: { 
                    "ShodhKosh: Journal of Visual...": 29, 
                    "Int. Journal of Advanced Computer Science...": 27, 
                    "Engineering Research Express": 20, 
                    "ICMHI 2025 - 9th Int. Conf. on Medical...": 15, 
                    "Journal of Medical Artificial Intelligence": 14 
                }
            }
        };

        // ฟังก์ชันสำหรับสร้างกราฟวงกลม (Pie Chart)
        function createPieChart(canvasId, dataObj, titleText) {
            new Chart(document.getElementById(canvasId), {
                type: 'pie',
                data: {
                    labels: Object.keys(dataObj),
                    datasets: [{
                        data: Object.values(dataObj),
                        backgroundColor: ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: { display: true, text: titleText, font: { size: 16 } }
                    }
                }
            });
        }

        // ฟังก์ชันสำหรับสร้างกราฟแท่ง (Bar Chart)
        function createBarChart(canvasId, dataObj, titleText) {
            new Chart(document.getElementById(canvasId), {
                type: 'bar',
                data: {
                    labels: Object.keys(dataObj),
                    datasets: [{
                        label: 'จำนวนบทความ (ฉบับ)',
                        data: Object.values(dataObj),
                        backgroundColor: '#3498db'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: { display: true, text: titleText, font: { size: 16 } },
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // วาดกราฟเมื่อหน้าเว็บโหลดเสร็จ
        window.onload = function() {
            // กราฟไฟล์ที่ 1
            createPieChart('chart-doc-type-1', scopusData.file1.docTypes, 'สัดส่วนประเภทเอกสาร (Document Type)');
            createBarChart('chart-source-1', scopusData.file1.topSources, 'Top 5 แหล่งตีพิมพ์ยอดนิยม (Source title)');

            // กราฟไฟล์ที่ 2
            createPieChart('chart-doc-type-2', scopusData.file2.docTypes, 'สัดส่วนประเภทเอกสาร (Document Type)');
            createBarChart('chart-source-2', scopusData.file2.topSources, 'Top 5 แหล่งตีพิมพ์ยอดนิยม (Source title)');
        };
    </script>
</body>
</html>
