<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scopus Data Dashboard</title>
    <!-- โหลดฟอนต์ Google Fonts เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- โหลดไลบรารี Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --ai-color: #3b82f6; /* สีฟ้าสำหรับ AI */
            --math-color: #8b5cf6; /* สีม่วงสำหรับ Math */
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 20px 60px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.2em;
            color: #111827;
            font-weight: 600;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 1.1em;
        }

        .section-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            margin: 0 auto 40px auto;
            max-width: 1200px;
            overflow: hidden;
        }

        .section-header {
            padding: 20px 30px;
            color: white;
            display: flex;
            align-items: center;
        }

        .section-header.ai {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .section-header.math {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        }

        .section-header h2 {
            margin: 0;
            font-size: 1.5em;
            font-weight: 500;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
            padding: 30px;
        }

        .chart-box {
            background: #fafafa;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 350px;
        }

        canvas {
            max-width: 100%;
        }

        /* สำหรับหน้าจอขนาดเล็ก (มือถือ) */
        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Scopus Research Dashboard</h1>
        <p>รายงานสรุปข้อมูลการตีพิมพ์แยกตามหมวดหมู่</p>
    </div>

    <!-- ส่วนที่ 1: Artificial Intelligence -->
    <div class="section-container">
        <div class="section-header ai">
            <h2>Artificial Intelligence</h2>
        </div>
        <div class="charts-grid">
            <div class="chart-box">
                <canvas id="ai-doc-type"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="ai-source"></canvas>
            </div>
        </div>
    </div>

    <!-- ส่วนที่ 2: Computational Theory AND Mathematics -->
    <div class="section-container">
        <div class="section-header math">
            <h2>Computational Theory AND Mathematics</h2>
        </div>
        <div class="charts-grid">
            <div class="chart-box">
                <canvas id="math-doc-type"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="math-source"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลที่ถูกดึงและสรุปผลมาจากไฟล์ทั้ง 2 ไฟล์
        const scopusData = {
            ai: {
                docTypes: { "Article": 261, "Conference paper": 39 },
                topSources: { 
                    "ShodhKosh: Journal of Visual...": 29, 
                    "Int. Journal of Advanced Computer Science...": 27, 
                    "Engineering Research Express": 20, 
                    "ICMHI 2025 - 9th Int. Conf. on Medical...": 15, 
                    "Journal of Medical Artificial Intelligence": 14 
                }
            },
            math: {
                docTypes: { "Article": 206, "Conference paper": 80, "Review": 11, "Conference review": 2, "Erratum": 1 },
                topSources: { 
                    "Leibniz Int. Proc. in Informatics": 17, 
                    "Nonlinear Dynamics": 9, 
                    "Mathematics": 5, 
                    "Electronics (Switzerland)": 4, 
                    "Chaos, Solitons and Fractals": 4 
                }
            }
        };

        // ตั้งค่าฟอนต์เริ่มต้นสำหรับ Chart.js
        Chart.defaults.font.family = "'Prompt', sans-serif";
        Chart.defaults.color = '#4b5563';

        // ฟังก์ชันสร้างกราฟโดนัท (Doughnut Chart) แทน Pie Chart เพื่อความทันสมัย
        function createDoughnutChart(canvasId, dataObj, titleText, colorPalette) {
            new Chart(document.getElementById(canvasId), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dataObj),
                    datasets: [{
                        data: Object.values(dataObj),
                        backgroundColor: colorPalette,
                        borderWidth: 2,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { 
                            display: true, 
                            text: titleText, 
                            font: { size: 16, weight: '600' },
                            padding: { bottom: 20 }
                        },
                        legend: { position: 'bottom' }
                    },
                    cutout: '60%' // ทำให้ตรงกลางกลวง (Doughnut)
                }
            });
        }

        // ฟังก์ชันสร้างกราฟแท่ง (Bar Chart)
        function createBarChart(canvasId, dataObj, titleText, barColor) {
            new Chart(document.getElementById(canvasId), {
                type: 'bar',
                data: {
                    labels: Object.keys(dataObj),
                    datasets: [{
                        label: 'จำนวนบทความ (ฉบับ)',
                        data: Object.values(dataObj),
                        backgroundColor: barColor,
                        borderRadius: 6, // ขอบกราฟมน
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { 
                            display: true, 
                            text: titleText, 
                            font: { size: 16, weight: '600' },
                            padding: { bottom: 20 }
                        },
                        legend: { display: false }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            grid: { color: '#e5e7eb' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // วาดกราฟเมื่อหน้าเว็บโหลดเสร็จ
        window.onload = function() {
            // ชุดสีสำหรับ AI (โทนเย็น/ฟ้า-เขียว)
            const aiColors = ['#3b82f6', '#10b981', '#06b6d4', '#6366f1', '#14b8a6'];
            // ชุดสีสำหรับ Math (โทนอุ่น/ม่วง-ส้ม)
            const mathColors = ['#8b5cf6', '#f59e0b', '#ec4899', '#f43f5e', '#84cc16'];

            // 1. หมวดหมู่ Artificial Intelligence
            createDoughnutChart('ai-doc-type', scopusData.ai.docTypes, 'สัดส่วนประเภทเอกสาร', aiColors);
            createBarChart('ai-source', scopusData.ai.topSources, 'Top 5 แหล่งตีพิมพ์ยอดนิยม (Source title)', '#3b82f6');

            // 2. หมวดหมู่ Computational Theory AND Mathematics
            createDoughnutChart('math-doc-type', scopusData.math.docTypes, 'สัดส่วนประเภทเอกสาร', mathColors);
            createBarChart('math-source', scopusData.math.topSources, 'Top 5 แหล่งตีพิมพ์ยอดนิยม (Source title)', '#8b5cf6');
        };
    </script>
</body>
</html>
