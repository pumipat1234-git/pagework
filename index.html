:root {
  --bg: #1d3f8f; --panel: #f1f7ff; --ink: #14234f; --edge: #0e1b4a;
  --green: #3ddc84; --red: #ff5a6e; --yellow: #ffc933; --blue: #4cc9f0; --pink: #ff8a2b; --purple: #2f66c8;
  font-family: "Courier New", Courier, monospace;
}
html[lang="th"] { font-family: "Loma", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif; }
html[lang="th"] h1, html[lang="th"] h2, html[lang="th"] h3, html[lang="th"] .btn { text-transform: none; letter-spacing: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh;
  background-image: linear-gradient(45deg, #221447 25%, transparent 25%, transparent 75%, #221447 75%), linear-gradient(45deg, #221447 25%, transparent 25%, transparent 75%, #221447 75%);
  background-size: 32px 32px; background-position: 0 0, 16px 16px; }
#app { max-width: 1100px; margin: 0 auto; padding: 16px; }
canvas, .sprite { image-rendering: pixelated; }
h1, h2, h3 { margin: 0 0 8px; text-transform: uppercase; letter-spacing: 1px; }
.logo { color: var(--yellow); text-shadow: 4px 4px 0 var(--pink), 8px 8px 0 var(--edge); font-size: clamp(28px, 6vw, 52px); text-align: center; margin: 24px 0 4px; }
.sub { color: var(--blue); text-align: center; margin: 0 0 24px; font-weight: bold; }
.panel { background: var(--panel); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--edge); padding: 14px; margin-bottom: 16px; }
.panel h2 { font-size: 16px; background: var(--ink); color: var(--yellow); margin: -14px -14px 12px; padding: 6px 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
.biz-card { text-align: center; cursor: pointer; font: inherit; color: inherit; background: var(--panel); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--edge); padding: 14px; }
.biz-card:hover, .biz-card:focus-visible { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--pink); outline: none; }
.biz-card .sprite { width: 96px; height: 96px; background: var(--blue); border: 4px solid var(--edge); margin-bottom: 8px; }
.biz-card ul { list-style: none; padding: 0; margin: 8px 0; font-size: 13px; text-align: left; }
.biz-card li::before { content: "\25B6 "; color: var(--pink); }
.cash-tag { background: var(--green); border: 3px solid var(--edge); padding: 2px 8px; font-weight: bold; display: inline-block; }
.btn { font: inherit; font-weight: bold; text-transform: uppercase; background: var(--yellow); color: var(--ink); border: 4px solid var(--edge); box-shadow: 4px 4px 0 var(--edge); padding: 8px 14px; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--pink); }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--edge); }
.btn:disabled { background: #bbb; color: #777; cursor: not-allowed; }
.btn.big { font-size: 18px; width: 100%; padding: 12px; background: var(--green); }
.btn.small { padding: 4px 8px; font-size: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.center { text-align: center; }
.hud { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 4px solid var(--edge); box-shadow: 4px 4px 0 var(--edge); padding: 8px 10px; }
.stat small { display: block; font-size: 11px; text-transform: uppercase; opacity: .7; }
.stat b { font-size: 20px; }
.pos { color: #0a8f48; } .neg { color: #d81e3b; }
.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
.scene { display: flex; align-items: flex-end; gap: 12px; background: linear-gradient(var(--blue) 70%, var(--green) 70%); border: 4px solid var(--edge); padding: 8px; margin-bottom: 12px; }
.scene .sprite { width: 128px; height: 128px; }
.scene .meta { margin-left: auto; text-align: right; font-weight: bold; background: var(--panel); border: 3px solid var(--edge); padding: 4px 8px; font-size: 13px; }
.field { margin-bottom: 14px; }
.field > label, .field > .lbl { display: block; font-weight: bold; margin-bottom: 4px; }
input[type=range] { width: 100%; accent-color: var(--pink); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 90px; font: inherit; font-weight: bold; padding: 6px; border: 3px solid var(--edge); background: #fff; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--purple); color: #fff; box-shadow: 3px 3px 0 var(--edge); }
.seg small { display: block; font-weight: normal; font-size: 12px; }
table.pl { width: 100%; border-collapse: collapse; font-size: 14px; }
table.pl td { padding: 2px 0; border-bottom: 1px dashed #c9b98a; }
table.pl td:last-child { text-align: right; font-weight: bold; }
table.pl tr.total td { border-top: 3px solid var(--edge); border-bottom: 0; font-size: 16px; }
.errors { background: var(--red); color: #fff; border: 3px solid var(--edge); padding: 6px 10px; margin: 8px 0; font-weight: bold; font-size: 13px; }
.note { font-size: 12px; opacity: .75; }
.log { list-style: none; padding: 0; margin: 0; max-height: 170px; overflow-y: auto; font-size: 13px; }
.log li { padding: 2px 0; border-bottom: 1px dotted #c9b98a; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { background: var(--pink); border: 3px solid var(--edge); padding: 1px 6px; font-size: 12px; font-weight: bold; }
.overlay { position: fixed; inset: 0; background: rgba(10, 5, 25, .8); display: grid; place-items: center; padding: 16px; z-index: 10; }
.modal { max-width: 520px; width: 100%; }
.choice { display: block; width: 100%; text-align: left; margin-bottom: 10px; }
.choice small { display: block; font-weight: normal; text-transform: none; margin-top: 2px; }
.end-banner { font-size: clamp(26px, 5vw, 44px); text-align: center; margin: 16px 0; }
.end-banner.won { color: var(--green); text-shadow: 3px 3px 0 var(--edge); }
.end-banner.lost { color: var(--red); text-shadow: 3px 3px 0 var(--edge); }
canvas.chart { width: 100%; height: auto; background: #fff; border: 3px solid var(--edge); }
.biz-card .btn { margin-top: 8px; }


/* ---- shared ---- */
.topbar { display: flex; justify-content: flex-end; margin-bottom: 8px; position: relative; z-index: 2; }
.lang-switch { display: inline-flex; border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--edge); }
.lang-switch button { font: inherit; font-weight: bold; min-height: 44px; min-width: 64px; padding: 4px 12px; border: 0; background: var(--panel); color: var(--ink); cursor: pointer; }
.lang-switch button[aria-pressed=true] { background: var(--purple); color: #fff; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.btn.go { background: var(--green); } .btn.danger { background: var(--red); color: #fff; }
.sub { overflow-wrap: anywhere; }

    c.stroke();
    c.fillStyle = "#ff7bd5";
    pts.forEach((v, i) => c.fillRect(Math.round(x(i)) - 3, Math.round(y(v)) - 3, 6, 6));
  }
  function drawBars(canvas2, rows) {
    const c = canvas2.getContext("2d");
    const W = canvas2.width, H = canvas2.height, base = H - 22, top = 14;
    c.fillStyle = "#eaf3ff";
    c.fillRect(0, 0, W, H);
    const maxAbs = Math.max(1, ...rows.map((r) => Math.abs(r.netProfit)));
    const hasLoss = rows.some((r) => r.netProfit < 0);
    const zero = hasLoss ? top + (base - top) * 0.6 : base;
    const scaleUp = zero - top, scaleDown = base - zero;
    c.fillStyle = "#9cb6e8";
    c.fillRect(8, Math.round(zero), W - 16, 2);
    const slot = (W - 24) / Math.max(6, rows.length), bw = Math.min(40, slot - 8);
    rows.forEach((r, i) => {
      const x = Math.round(12 + i * slot + (slot - bw) / 2);
      const v = r.netProfit >= 0 ? Math.max(3, Math.round(r.netProfit / maxAbs * scaleUp)) : Math.max(3, Math.round(-r.netProfit / maxAbs * scaleDown));
      const y = r.netProfit >= 0 ? zero - v : zero;
      c.fillStyle = "#14234f";
      c.fillRect(x - 2, y - 2, bw + 4, v + 4);
      c.fillStyle = r.netProfit >= 0 ? "#3ddc84" : "#ff5a6e";
      c.fillRect(x, y, bw, v);
      c.fillStyle = r.netProfit >= 0 ? "#9affc4" : "#ff9aa8";
      c.fillRect(x, y, 4, v);
      c.fillStyle = "#14234f";
      c.font = "bold 13px monospace";
      c.textAlign = "center";
      c.fillText(`M${r.month}`, x + bw / 2, H - 6);
    });
  }
  var act = ctx.act;
  act.go = (route) => {
    S.route = route;
    S.notice = null;
    S.resetDone = false;
    if (route === "home") S.flow = { biz: null, confirmed: false };
    render(false);
    window.scrollTo(0, 0);
  };
  act.toHome = () => {
    if (S.practice) return act.leavePractice();
    S.state = null;
    S.tut = null;
    act.go("home");
  };
  act.openModal = (kind, extra = {}) => {
    S.modal = { kind, ...extra };
    render();
  };
  act.closeModal = () => {
    S.modal = null;
    render();
  };
  act.resetData = () => {
    resetGameData();
    S.modal = null;
    S.resetDone = true;
    S.state = null;
    S.tut = null;
    render();
  };
  act.openHelp = () => act.openModal("help");
  act.changeLang = (code) => {
    if (code === getLang()) return;
    setLang(code);
    render();
    document.querySelector(`[data-lang="${code}"]`)?.focus();
    toast("toast.lang");
  };
  act.startFlow = () => {
    S.flow = { biz: null, confirmed: false };
    if (ctx.saved) act.openModal("overwrite", { info: saveInfoText(), onYes: () => {
      S.flow.confirmed = true;
      S.modal = null;
      act.go("careers");
    } });
    else act.go("careers");
  };
  act.pickCareer = (id) => {
    S.flow.biz = id;
    act.go("intro");
  };
  function newGameStart(withTutorial) {
    S.modal = null;
    S.practice = null;
    S.state = createGame(S.flow.biz);
    S.decisions = defaultDecisions();
    S.notice = null;
    S.tab = "overview";
    S.tutHidden = false;
    S.tut = withTutorial ? newTutorial() : null;
    if (!withTutorial) setTutorialDone(true);
    autosave();
    S.route = "game";
    render(false);
    window.scrollTo(0, 0);
  }
  act.begin = (withTutorial) => {
    if (ctx.saved && !S.flow.confirmed) {
      return act.openModal("overwrite", { info: saveInfoText(), onYes: () => {
        S.flow.confirmed = true;
        newGameStart(withTutorial);
      } });
    }
    newGameStart(withTutorial);
  };
  act.continueGame = () => {
    const s = loadValidSave();
    if (!s) {
      S.notice = t4("home.saveBroken");
      clearSave();
      return render();
    }
    S.state = s;
    S.decisions = defaultDecisions();
    S.notice = null;
    S.tab = "overview";
    S.tut = null;
    S.practice = null;
    S.route = "game";
    render(false);
    window.scrollTo(0, 0);
  };
  act.startPractice = () => {
    S.modal = null;
    const stash = S.state && !S.practice ? { state: S.state, decisions: S.decisions, tab: S.tab, route: S.route } : S.practice?.stash ?? null;
    S.practice = { stash };
    S.state = createGame("clothing");
    S.decisions = defaultDecisions();
    S.tab = "overview";
    S.tut = newTutorial();
    S.tutHidden = false;
    S.notice = null;
    S.route = "game";
    render(false);
    window.scrollTo(0, 0);
  };
  act.leavePractice = () => {
    const stash = S.practice?.stash;
    S.practice = null;
    S.tut = null;
    if (stash) {
      S.state = stash.state;
      S.decisions = stash.decisions;
      S.tab = stash.tab;
      S.route = "game";
      render(false);
    } else {
      S.state = null;
      act.go("home");
    }
  };
  act.exitGame = () => {
    if (S.practice) return act.leavePractice();
    act.openModal("exit", { onYes: () => {
      autosave();
      S.modal = null;
      S.state = null;
      S.tut = null;
      act.go("home");
    } });
  };
  act.setTab = (id) => {
    if (!TABS.includes(id)) return;
    S.tab = id;
    touch2(`tab:${id}`);
    render(false);
  };
  act.setPrice = (id) => {
    S.decisions = { ...S.decisions, priceStrategy: id };
    touch2("price");
    toast("toast.price", { label: t4(`price.${id}.label`) });
    render();
  };
  act.setMarketing = (value, commit) => {
    S.decisions = { ...S.decisions, marketing: value };
    touch2("marketing");
    if (commit) {
      toast("toast.marketing", { value: money5(value) });
      render();
    }
  };
  act.toggleUpgrade = () => {
    S.decisions = { ...S.decisions, upgrade: !S.decisions.upgrade };
    touch2("upgrade");
    toast(S.decisions.upgrade ? "toast.upgradeOn" : "toast.upgradeOff");
    render();
  };
  act.loan = (delta) => {
    S.decisions = { ...S.decisions, loanChange: S.decisions.loanChange + delta };
    touch2("loan");
    toast("toast.loan", { change: signedMoney3(S.decisions.loanChange) });
    render();
  };
  act.endMonth = () => {
    try {
      S.state = advanceMonth(S.state, S.decisions).state;
      S.decisions = { ...S.decisions, upgrade: false, loanChange: 0 };
      S.notice = null;
      touch2("month");
      autosave();
      if (S.state.lastReport) toast("toast.month", { month: S.state.lastReport.month, profit: signedMoney3(S.state.lastReport.netProfit) });
    } catch (e) {
      S.notice = e;
    }
    render(false);
    window.scrollTo(0, 0);
  };
  act.pickEvent = (choiceId) => {
    try {
      S.state = resolveEvent(S.state, choiceId);
      S.notice = null;
      autosave();
      toast("toast.event");
    } catch (e) {
      S.notice = e;
    }
    render();
  };
  function finishTutorial() {
    S.tut = null;
    S.tutHidden = false;
    setTutorialDone(true);
  }
  act.tutSkip = () => {
    finishTutorial();
    render();
  };
  act.tutHide = () => {
    S.tutHidden = true;
    render();
  };
  act.tutShow = () => {
    S.tutHidden = false;
    render();
  };
  act.tutMove = (dir) => {
    if (dir === "next" && isLast(S.tut)) {
      finishTutorial();
      return render();
    }
    if (!move(S.tut, dir)) return;
    S.tab = TUTORIAL_CHAPTERS[S.tut.chapter].tab;
    render(false);
    applyHighlight(true);
  };
  initLang();
  checkStorage();
  document.body.append(h("div", { id: "toasts", "aria-live": "polite", role: "status" }));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && S.modal) act.closeModal();
  });
  window.__i18nMissing = missing;
  if (readSave() && !loadValidSave()) {
    const raw = readSave();
    let finished = false;
    try {
      finished = deserialize(raw).status !== "playing";
    } catch {
    }
    if (!finished) S.notice = t4("home.saveBroken");
    clearSave();
  }
  render(false);
})();

</script>
</body>
